<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brian the Barbarian</title>
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="shortcut icon" href="images/favicon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true">
      <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

      <div class="sidebar-drawer" role="dialog" aria-modal="true" aria-label="Navigációs menü">
        <div class="sidebar-drawer-header">
          <img
            class="sidebar-brand-avatar"
            alt="Brian the Barbarian"
            src="images/brian-the-barbarian.png"
            onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=Brian+the+Barbarian&background=111827&color=ffffff&rounded=true&size=128&format=png'"
          />
          <div class="sidebar-brand-title">Brian the Barbarian</div>
        </div>

        <div class="sidebar-nav" id="sidebar"></div>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="topbar-left">
          <button id="sidebarToggle" class="topbar-menu-toggle" type="button" aria-label="Menü"></button>

          <img
            class="topbar-brand-avatar"
            alt="Brian the Barbarian"
            src="images/brian-the-barbarian.png"
            onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=Brian+the+Barbarian&background=111827&color=ffffff&rounded=true&size=128&format=png'"
          />

          <div class="topbar-brand-title">Brian the Barbarian</div>
        </div>

        <div class="crumbs" id="topBreadcrumb"></div>

        <div class="topbar-actions">
          <span class="topbar-separator" aria-hidden="true"></span>

          <div class="topbar-action-menu">
            <button
              id="topbarActionBtn"
              class="topbar-icon-button"
              type="button"
              aria-expanded="false"
              aria-label="Discord">
              <span class="btn-icon" id="discordIcon"></span>
            </button>

            <div id="topbarActionMenu" class="topbar-action-dropdown">
              <a id="topbarAddBotItem" class="topbar-action-item" href="#" target="_blank" rel="noreferrer">
                <span class="topbar-action-item-icon" aria-hidden="true">
                  <svg viewBox="0 0 512 512">
                    <path d="M426.537,0H179.641c-22.243,0-40.376,18.175-40.376,40.401v129.603h25.221V69.106h277.206V424.46H164.485v-83.887h-25.221v131.034c0,22.192,18.133,40.392,40.376,40.392h246.896c22.192,0,40.375-18.2,40.375-40.392v-129.03V40.401C466.912,18.175,448.728,0,426.537,0z M303.08,478.495c-9.174,0-16.636-7.47-16.636-16.661c0-9.183,7.462-16.653,16.636-16.653c9.158,0,16.686,7.47,16.686,16.653C319.766,471.025,312.247,478.495,303.08,478.495z"></path>
                    <polygon points="225.739,335.774 358.778,255.289 225.739,174.804 225.739,221.11 45.088,221.11 45.088,289.468 225.739,289.468"></polygon>
                  </svg>
                </span>
                <span data-i18n="topbar.installBrian">Brian telepítése</span>
              </a>

              <button id="topbarSupportItem" class="topbar-action-item topbar-action-item-support" type="button">
                <span class="topbar-action-item-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M19.75 14V11.75H22V10.25H19.75V8H18.25V10.25H16V11.75H18.25V14H19.75Z"></path>
                    <path d="M11 4C8.79 4 7 5.79 7 8C7 10.21 8.79 12 11 12C13.21 12 15 10.21 15 8C15 5.79 13.21 4 11 4Z"></path>
                    <path d="M3 18C3 15.34 8.33 14 11 14C13.67 14 19 15.34 19 18V20H3V18Z"></path>
                  </svg>
                </span>
                <span class="support-meta">
                  <strong data-i18n="topbar.discordServer">Brian Discord szerver</strong>
                  <small id="supportBtnStatus" data-i18n="support.loadingStatus">Szerveradatok...</small>
                </span>
              </button>
            </div>
          </div>

          <div id="discordWidgetPanel" class="discord-widget-panel">
            <div class="discord-widget-header">
              <img class="discord-widget-avatar" src="images/brian-the-barbarian.png" alt="Brian the Barbarian" />
              <div class="discord-widget-meta">
                <div id="discordWidgetName" class="discord-widget-name" data-i18n="support.serverName">Discord szerver</div>
                <div id="discordWidgetStatus" class="discord-widget-status" data-i18n="support.loadingData">Adatok betöltése...</div>
              </div>
            </div>
            <div id="discordWidgetLoading" class="discord-widget-loading" data-i18n="support.widgetLoading">Widget betöltése...</div>
            <iframe id="discordWidgetFrame" class="discord-widget-frame" title="Discord widget" allowtransparency="true" frameborder="0" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>
          </div>

          <div class="language-picker" id="languagePicker">
            <button id="languageCurrent" class="language-current" type="button"></button>
            <div id="languageMenu" class="language-menu"></div>
          </div>
        </div>
      </header>

      <main class="content" id="content"></main>

      <footer class="downbar">
        <div class="downbar-inner">
          <div class="downbar-title">Brian the Barbarian Discord bot</div>

          <div class="downbar-updated">
            <span data-i18n="footer.lastUpdated">Utolsó frissítés:</span>
            <span id="lastUpdatedText">
              <span class="loading-dots" data-i18n-aria-label="common.loading" aria-label="Betöltés">
                <span>.</span><span>.</span><span>.</span>
              </span>
            </span>
          </div>

          <button id="visitorStatsTrigger" class="downbar-link" type="button" data-i18n="sidebar.visitors">
            Látogatók:
          </button>
        </div>
      </footer>
    </div>
  </div>

  <script data-goatcounter="https://brianthebarbarian.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <script
    data-name="BMC-Widget"
    data-cfasync="false"
    src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js"
    data-id="brian.the.barbarian"
    data-description="Support me on Buy me a coffee!"
    data-message=""
    data-color="#FF813F"
    data-position="Right"
    data-x_margin="18"
    data-y_margin="18">
  </script>
  <script src="app.js"></script>
</body>
</html>
